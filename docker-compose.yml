services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - webnet

  api:
    build:
      context: ./wizetale-api
      dockerfile: Dockerfile
    image: wizetale-api
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-https://wizetale.com,https://www.wizetale.com}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - webnet

  celery-worker:
    build:
      context: ./wizetale-api
      dockerfile: Dockerfile
    image: wizetale-api
    init: true
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - webnet

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/bin/sh", "-c", "(while :; do sleep 12h; nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - webnet

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  redis_data:

networks:
  webnet:
    driver: bridge
