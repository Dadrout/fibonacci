name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizetale-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizetale-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: wizetale-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/ui-typography.test.mjs
      - run: node scripts/teacher-content.test.mjs
      - run: node scripts/teacher-localization.test.mjs
      - run: node scripts/backend-proxy.test.cjs
      - run: node scripts/teacher-sources.test.cjs
      - run: node scripts/learner-privacy.test.cjs
      - run: node scripts/story-poller.test.cjs
      - run: node scripts/auth-identity.test.cjs
      - run: node scripts/learner-storage.test.cjs
      - run: node --experimental-strip-types --no-warnings --test scripts/brain-*.test.mjs
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: touch .env.brain && docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.brain.yml config --quiet
        env:
          TALESPARK_LOCAL_REDIS_PASSWORD: ci-only

  brain-db:
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:17.6.1.178
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -h localhost"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      PGPASSWORD: ci-only-password
      PSQL: psql -h localhost -U supabase_admin -d postgres
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in supabase/local/00-storage-stub.sql supabase/schema.sql supabase/brain.sql; do
            $PSQL -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: supabase/tests/run_brain_tests.sh
