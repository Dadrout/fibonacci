worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  client_max_body_size 20m;

  limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
  limit_req_status 429;

  upstream api_backend {
    server api:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name api.wizetale.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name api.wizetale.com;

    ssl_certificate /etc/letsencrypt/live/api.wizetale.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wizetale.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
      limit_req zone=api_general burst=40 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 180s;
    }
  }
}
