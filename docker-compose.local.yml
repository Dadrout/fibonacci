# Loopback-only development endpoints. Use with docker-compose.yml and -p fibonacci-local.
services:
  redis:
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes", "--requirepass", "${FIBONACCI_LOCAL_REDIS_PASSWORD:?Set local Redis password in .env}"]
    environment:
      REDISCLI_AUTH: ${FIBONACCI_LOCAL_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
  api:
    image: fibonacci-api-local
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ENVIRONMENT: development
      API_ALLOWED_ORIGINS: http://localhost:3001
      MEDIA_STORAGE_PROVIDER: supabase
      REDIS_URL: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/1
  celery-worker:
    image: fibonacci-api-local
    environment:
      ENVIRONMENT: development
      MEDIA_STORAGE_PROVIDER: supabase
      REDIS_URL: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/1
