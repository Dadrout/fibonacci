# Fibonacci Brain local database: Postgres (pgvector, Supabase roles/auth schema) + PostgREST.
# Used for development, RLS tests, and the offline demo (BRAIN_STORE=local).
#   supabase/local/setup.sh      # once: creates .env.brain with local-only secrets
#   docker compose -p fibonacci-local -f docker-compose.yml -f docker-compose.local.yml \
#     -f docker-compose.brain.yml up -d --build redis brain-db brain-rest api celery-worker
services:
  brain-db:
    image: supabase/postgres:17.6.1.178
    restart: unless-stopped
    env_file:
      - ./.env.brain
    volumes:
      - brain_db:/var/lib/postgresql/data
      - ./supabase:/brain-sql:ro,z
      - ./supabase/local/zz-brain-init.sh:/docker-entrypoint-initdb.d/zz-brain-init.sh:ro,z
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "supabase_admin", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - webnet

  brain-rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    env_file:
      - ./.env.brain
    depends_on:
      brain-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:54321:3000"
    networks:
      - webnet

  api:
    env_file:
      - ./.env
      - ./.env.brain
    volumes:
      - brain_media:/app/brain-media:z
      # Local development: run the working tree's code (restart the service after edits).
      - ./wizetale-api/app:/app/app:ro,z
      # Recorded AI outputs (DEMO_MODE replays them; BRAIN_AI_RECORD=true writes new ones).
      - ./wizetale-api/app/services/brain/ai/recorded:/app/app/services/brain/ai/recorded:z
      # The three demo inputs, for the "Send the 3 demo items" button (DEMO_MODE only).
      - ./demo/hero:/app/demo-hero:ro,z

  celery-worker:
    # Process the three hero-demo captures side by side.
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - ./.env
      - ./.env.brain
    volumes:
      - brain_media:/app/brain-media:z
      # Local development: run the working tree's code (restart the service after edits).
      - ./wizetale-api/app:/app/app:ro,z
      - ./wizetale-api/app/services/brain/ai/recorded:/app/app/services/brain/ai/recorded:z

  telegram-bot:
    image: fibonacci-api-local
    init: true
    restart: unless-stopped
    command: ["python", "-m", "app.services.brain.telegram.poller"]
    healthcheck:
      disable: true
    env_file:
      - ./.env
      - ./.env.brain
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${FIBONACCI_LOCAL_REDIS_PASSWORD}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - brain_media:/app/brain-media:z
      - ./wizetale-api/app:/app/app:ro,z
    networks:
      - webnet

volumes:
  brain_db:
  brain_media:
